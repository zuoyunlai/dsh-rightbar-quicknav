name: Publish

# 只在推版本 tag 时发布；日常提交只跑 Test。
# 走 npm Trusted Publishing（OIDC）：CI 用一次性身份换取短期发布凭据，
# 不需要 NPM_TOKEN，也不受「发布需 2FA」限制 —— 本地绝不 npm publish。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # 建 GitHub Release + 上传 tgz
  id-token: write # OIDC：Trusted Publishing 必需

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing 需要 npm >= 11.5.1
      - name: Upgrade npm
        run: npm install -g npm@^11.5.1

      - name: Tag must match package.json and client.js
        run: node scripts/verify-version.mjs

      - name: Checks
        run: |
          node --check client.js
          node --check index.js
          node --test tests/*.test.mjs

      # 不传 NODE_AUTH_TOKEN：npm 会用 GitHub 的 OIDC token 向 npm 换取短期发布权限
      - name: Publish to npm
        run: npm publish --access public --provenance

      # npm 会把新版本先放进处理队列（可能几分钟），此期间 `npm publish` 也算成功。
      # 没有这道等待，「workflow 绿了但 npm 上查不到」会静默通过。
      - name: Wait until npm actually serves this version
        run: |
          v=$(node -p "require('./package.json').version")
          for i in $(seq 1 40); do
            if npm view "dsh-rightbar-quicknav@$v" version >/dev/null 2>&1; then
              echo "✓ $v is live on npm"
              exit 0
            fi
            echo "… $v not published yet ($i/40), waiting 15s"
            sleep 15
          done
          echo "✗ $v did not become available on npm within 10 minutes"
          exit 1

      - name: Pack release asset
        run: npm pack

      - name: Build release notes from CHANGELOG
        run: node scripts/release-notes.mjs

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" ./*.tgz \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --latest
